<html>

<head>
  <title>Baseball Realtime Color Guide</title>
  <style>
    body {
      font-family: monospace, Helvetica, Arial;
    }

    table {
      border-collapse: collapse;
    }

    th,
    td {
      font-size: larger;
      padding: 6px 16px;
    }
  </style>
</head>

<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <table>
      <thead>
        <tr>
          <th style="text-align:left">Swatch</th>
          <th style="text-align:left">Hex</th>
          <th style="text-align:left">Purpose</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#FFADAD;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#FFADAD</code></td>
          <td>Final</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#FFD6A5;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#FFD6A5</code></td>
          <td>Scheduled</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#FDFFB6;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#FDFFB6</code></td>
          <td>No-hitter watch</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#CAFFBF;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#CAFFBF</code></td>
          <td>Live</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#98F6FF;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#98F6FF</code></td>
          <td>Extras</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#A0C4FF;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#A0C4FF</code></td>
          <td>Delayed</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#BDB2FF;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#BDB2FF</code></td>
          <td>Cancelled</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#FFC6FF;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#FFC6FF</code></td>
          <td>Postponed</td>
        </tr>
        <tr>
          <td>
            <div style="width:72px;height:72px;background:#FFFDE7;border:1px solid #00000022;border-radius:4px"></div>
          </td>
          <td><code>#FFFDE7</code></td>
          <td>Suspended</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>

</html>
