<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 32">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@800&amp;display=swap');
    text { font-family: "DM Sans", system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #15161a; letter-spacing: 0.01em; }
  </style>
  <!-- SC -->
  <text x="0" y="24">SC</text>
  <!-- Diamond glyph in place of O — centered at x≈67, baseline≈24, cap-height≈17px so center ≈15 -->
  <g transform="translate(67, 7)">
    <polygon points="9,0 17,9 9,18 1,9" fill="#efeae0" stroke="#15161a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 2B -->
    <rect x="6" y="-3" width="6" height="6" fill="#efeae0" stroke="#15161a" stroke-width="1.5"/>
    <!-- 1B -->
    <rect x="14" y="6" width="6" height="6" fill="#efeae0" stroke="#15161a" stroke-width="1.5"/>
    <!-- Home -->
    <rect x="6" y="15" width="6" height="6" fill="#efeae0" stroke="#15161a" stroke-width="1.5"/>
    <!-- 3B -->
    <rect x="-2" y="6" width="6" height="6" fill="#efeae0" stroke="#15161a" stroke-width="1.5"/>
  </g>
  <!-- REBOOK -->
  <text x="88" y="24">REBOOK</text>
</svg>
