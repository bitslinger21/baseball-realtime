<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 32">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@800&amp;display=swap');
    .wm { font-family: "DM Sans", system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #15161a; }
  </style>
  <!-- Sc -->
  <text class="wm" x="0" y="24">Sc</text>
  <!-- Diamond glyph replacing first o, centered at x=52 cap-mid y=15 -->
  <g transform="translate(43, 6)">
    <polygon points="9,0 17,9 9,18 1,9" fill="#efeae0" stroke="#15161a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- home plate only, rotated 45deg, inside diamond -->
    <rect x="6.25" y="10.25" width="3.5" height="3.5" fill="#efeae0" stroke="#15161a" stroke-width="1.5" transform="rotate(45 9 12)"/>
  </g>
  <!-- rebook -->
  <text class="wm" x="62" y="24">rebook</text>
</svg>
