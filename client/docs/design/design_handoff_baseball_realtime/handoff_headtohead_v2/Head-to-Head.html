<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head-to-head — Scorebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}body{font-family:'DM Sans',system-ui,sans-serif;background:#f4f1ea;color:#15161a}
a{color:#b8421e}a:hover{color:#15161a}
tr.tr-hover:hover td{background:#efeae0}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="scorebook-cell.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="holistic/shared.jsx"></script>
<script type="text/babel" src="holistic/scoring-widget.jsx"></script>
<script type="text/babel" src="holistic/scoring-widget-toolbar.jsx"></script>
<script type="text/babel" src="holistic/game-v2.jsx"></script>
<script type="text/babel" src="holistic/game-scout.jsx"></script>
<script type="text/babel" src="holistic/game-headtohead.jsx"></script>
<script type="text/babel" src="holistic/game-headtohead-v2.jsx"></script>
<script type="text/babel">
// Page-local scenario (shared mocks untouched — the game view still shows Pearson):
// Valdez pulled with 2 out in the 6th, Josh Hader in. Pearson goes back to the bullpen.
const PITCHING_HADER = {
  away: { today: [['IP', '5 2/3'], ['R', '3'], ['K', '6'], ['BB', '2']],
    current: { team: TEAMS.HOU, num: 71, name: 'Josh Hader', hand: 'LHP', mlbId: 623352, era: '2.10',
      line: [['Record', '3–1'], ['ERA', '2.10']],
      today: [['IP', '1 1/3'], ['R', '0'], ['K', '3'], ['BB', '0']],
      relieved: { name: 'Framber Valdez', inning: '6th', line: '5 2/3 IP, 3 R', order: 2 } } },
  home: { today: [['IP', '7'], ['R', '3'], ['K', '8'], ['BB', '1']] },
};
const LINEUPS_HADER = { ...LINEUPS, HOU: { ...LINEUPS.HOU, bullpen: [
  { num: 29, name: 'Nate Pearson', hand: 'RHP', era: '3.12' },
  ...LINEUPS.HOU.bullpen.filter(b => b.name !== 'Josh Hader'),
] } };
function H2HPage() {
  const [state, setState] = React.useState(() => localStorage.getItem('h2h-demo-state') || 'pregame');
  React.useEffect(() => { localStorage.setItem('h2h-demo-state', state); }, [state]);
  const live = state === 'live';
  return (
    <div style={{ maxWidth: 1240, margin: '0 auto', padding: '28px 24px 60px', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap' }}>
        <div>
          <Eyebrow>Game view · Head-to-head tab</Eyebrow>
          <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em', marginTop: 4 }}>HOU @ CHC · Head-to-head</div>
          <div style={{ fontSize: 13, color: T.textMuted, marginTop: 4 }}>{live ? 'Live (▼7) — Valdez pulled in the 6th, Hader on the mound; Cubs hitters are matched against him' : 'Pregame — matchups are against the probable starters'}</div>
        </div>
        <Segmented items={['Pregame', 'Live']} active={live ? 1 : 0} onClick={(i) => setState(i ? 'live' : 'pregame')} />
      </div>
      {live
        ? <HeadToHeadScreenV2 key="live" lineups={LINEUPS_HADER} probables={PROBABLES} pitching={PITCHING_HADER} initial={{ side: 'CHC', slot: 3 }} />
        : <HeadToHeadScreenV2 key="pre" lineups={LINEUPS} probables={PROBABLES} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<H2HPage />);
</script>
</body>
</html>
