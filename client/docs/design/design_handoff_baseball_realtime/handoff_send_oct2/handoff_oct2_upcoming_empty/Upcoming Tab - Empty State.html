<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upcoming Tab — Empty State</title>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'DM Sans',sans-serif}a{color:#b8421e}a:hover{color:#8f3216}.ue-frame{position:absolute;width:1160px;background:#f4f1ea;padding:8px 32px 32px;box-sizing:border-box}.ue-cap{font:600 13px 'DM Sans',sans-serif;color:#5c574f;letter-spacing:.04em;text-transform:uppercase;margin:16px 0 0}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="scorebook-cell.js"></script>
<script type="text/babel" src="holistic/shared.jsx"></script>
<script type="text/babel" src="holistic/player-upcoming.jsx"></script>
<script type="text/babel">
const E = {
  waiting: { kind: 'waiting',
    why: 'The Astros won the ALDS. Their ALCS opponent is the winner of Yankees–Guardians, which is tied 2–2 with Game 5 tonight.',
    facts: [
      { label: 'Next series', value: 'ALCS · best of 7' },
      { label: 'Opponent', pair: [TEAMS.NYY, TEAMS.CLE], sub: 'Set after Game 5 tonight' },
      { label: 'Game 1', value: 'Sat 10/17', mono: true, sub: 'Start time not announced' },
    ] },
  eliminated: { kind: 'eliminated',
    why: 'The Astros were eliminated by the Yankees in the ALDS, 3–1, on Oct 9. The 2027 schedule isn\u2019t out yet.',
    link: 'See his 2026 season in Stats',
    facts: [
      { label: 'Last game', value: 'Oct 9 · NYY 5 – 2 HOU', mono: true, sub: 'ALDS Game 4 · lost series 1–3' },
    ] },
  offseason: { kind: 'offseason',
    why: 'Spring training starts in February. Projections return when the first regular-season starters are announced.',
    facts: [
      { label: 'Opening Day 2027', value: 'Thu 3/25 · vs LAA', mono: true, teams: [TEAMS.LAA], sub: 'Start time not announced' },
    ] },
};
const TBD_GAMES = [{ id: 't1', date: 'Sat · Oct 17', time: '8:08p', home: true, opp: TEAMS.NYY, venue: 'Daikin Park', starter: { status: 'tbd' }, pitcher: null }];
const rows = [['01 · Between series (postseason)', 'waiting'], ['02 · Eliminated', 'eliminated'], ['03 · Off-season', 'offseason'], ['04 · Opponent known, starter TBD', 'tbd']];
function Review() {
  return rows.map(([cap, k], i) => (
    <div key={k} className="ue-frame" data-screen-label={cap} style={{ left: 0, top: i * 420 }}>
      <div className="ue-cap">{cap}</div>
      {k === 'tbd' ? <UpcomingTab games={TBD_GAMES} /> : <UpcomingTab empty={E[k]} />}
    </div>
  ));
}
ReactDOM.createRoot(document.getElementById('root')).render(<Review />);
</script>
</body>
</html>
