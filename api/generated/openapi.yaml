openapi: 3.0.0
paths:
  /games/today:
    get:
      operationId: Games_today
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameDto"
        "500":
          description: ""
      summary: List games for today
      tags: &a1
        - games
  /games/id/{id}:
    get:
      operationId: Games_findByMyId
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDto"
        "404":
          description: ""
      summary: List games by internal ID
      tags: *a1
  /games/providerId/{providerGameId}:
    get:
      operationId: Games_findByProviderId
      parameters:
        - name: providerGameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameViewDto"
        "404":
          description: ""
      summary: List games by provider ID
      tags: *a1
  /games:
    get:
      operationId: Games_listByDate
      parameters:
        - name: date
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameViewDto"
        "500":
          description: ""
      summary: List games for specific date
      tags: *a1
  /games/{providerGameId}/alerts:
    get:
      operationId: Alerts_listAlertsForGame
      parameters:
        - name: providerGameId
          required: true
          in: path
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - Alerts
  /realtime/ping:
    get:
      operationId: Realtime_ping
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a2
        - Realtime
  /realtime/test:
    post:
      operationId: Realtime_sendTest
      parameters: []
      responses:
        "201":
          description: ""
      tags: *a2
  /poller/enable:
    get:
      operationId: Poller_enable
      parameters:
        - name: gameId
          required: true
          in: query
          schema:
            type: string
        - name: cadence
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: &a3
        - Poller
  /poller/disable:
    get:
      operationId: Poller_disable
      parameters:
        - name: gameId
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a3
  /poller/kick/{gameId}:
    post:
      operationId: Poller_kickOnce
      parameters:
        - name: gameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      tags: *a3
  /poller/{gameId}/meta:
    get:
      operationId: Poller_getGameMeta
      parameters:
        - name: gameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a3
  /boxscore/{providerGameId}:
    get:
      operationId: BoxScore_get
      parameters:
        - name: providerGameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoxScoreDto"
      tags:
        - boxscore
info:
  title: Baseball Realtime API
  description: API for baseball-realtime
  version: 1.0.12
  contact: {}
tags: []
servers: []
components:
  schemas:
    GameDto:
      type: object
      properties:
        id:
          type: string
          description: Internal unique game ID (UUID)
          example: 2f1e8d10-4b8a-4e59-a07a-61d9c6c4cf71
        providerGameId:
          type: string
          description: External provider-assigned game ID
          example: "663937"
        gameDate:
          type: string
          description: UTC calendar date of the game (YYYY-MM-DD)
          example: 2025-10-30
        homeAbbr:
          type: string
          description: Home team abbreviation (usually 2–5 chars)
          example: HOU
          maxLength: 5
        awayAbbr:
          type: string
          description: Away team abbreviation (usually 2–5 chars)
          example: DET
          maxLength: 5
        homeName:
          type: string
          description: Home team abbreviation (usually 2–5 chars)
          example: HOU
          maxLength: 5
        awayName:
          type: string
          description: Away team abbreviation (usually 2–5 chars)
          example: DET
          maxLength: 5
        status:
          type: string
          description: Current game status
          enum: &a4
            - scheduled
            - live
            - final
          example: final
        startTimeUtc:
          type: string
          description: Start time of the game in UTC (timestamp)
          format: date-time
          example: 2025-10-30T19:05:00Z
          nullable: true
        snapshot:
          type: object
          description: Arbitrary JSON snapshot of provider metadata (venue, IDs, etc.)
          example: &a5
            venue: Minute Maid Park
            providerVenueId: 2143
            feedUrl: https://api.sportsdata.io/v4/mlb/scores/json/Game/663937
          nullable: true
      required:
        - gameDate
        - homeAbbr
        - awayAbbr
        - homeName
        - awayName
        - status
    GameViewDto:
      type: object
      properties:
        id:
          type: string
          description: Internal unique game ID (UUID)
          example: 2f1e8d10-4b8a-4e59-a07a-61d9c6c4cf71
        providerGameId:
          type: string
          description: External provider-assigned game ID
          example: "663937"
        gameDate:
          type: string
          description: UTC calendar date of the game (YYYY-MM-DD)
          example: 2025-10-30
        homeAbbr:
          type: string
          description: Home team abbreviation (usually 2–5 chars)
          example: HOU
          maxLength: 5
        awayAbbr:
          type: string
          description: Away team abbreviation (usually 2–5 chars)
          example: DET
          maxLength: 5
        homeName:
          type: string
          description: Home team abbreviation (usually 2–5 chars)
          example: HOU
          maxLength: 5
        awayName:
          type: string
          description: Away team abbreviation (usually 2–5 chars)
          example: DET
          maxLength: 5
        status:
          type: string
          description: Current game status
          enum: *a4
          example: final
        startTimeUtc:
          type: string
          description: Start time of the game in UTC (timestamp)
          format: date-time
          example: 2025-10-30T19:05:00Z
          nullable: true
        snapshot:
          type: object
          description: Arbitrary JSON snapshot of provider metadata (venue, IDs, etc.)
          example: *a5
          nullable: true
        homeTeamMeta:
          type: object
          nullable: true
        awayTeamMeta:
          type: object
          nullable: true
      required:
        - gameDate
        - homeAbbr
        - awayAbbr
        - homeName
        - awayName
        - status
    TeamLineScoreDto:
      type: object
      properties:
        runs:
          type: number
        hits:
          type: number
        errors:
          type: number
      required:
        - runs
        - hits
        - errors
    BatterLineDto:
      type: object
      properties:
        playerId:
          type: number
        name:
          type: string
        battingOrder:
          type: object
          nullable: true
        ab:
          type: number
        r:
          type: number
        h:
          type: number
        rbi:
          type: number
        bb:
          type: number
        so:
          type: number
        hr:
          type: number
      required:
        - playerId
        - name
        - ab
        - r
        - h
        - rbi
        - bb
        - so
        - hr
    PitcherLineDto:
      type: object
      properties:
        playerId:
          type: number
        name:
          type: string
        ip:
          type: string
        h:
          type: number
        r:
          type: number
        er:
          type: number
        bb:
          type: number
        so:
          type: number
        pitches:
          type: object
          nullable: true
        strikes:
          type: object
          nullable: true
      required:
        - playerId
        - name
        - ip
        - h
        - r
        - er
        - bb
        - so
    BoxScoreSideDto:
      type: object
      properties:
        teamAbbr:
          type: string
        linescore:
          $ref: "#/components/schemas/TeamLineScoreDto"
        batting:
          type: array
          items:
            $ref: "#/components/schemas/BatterLineDto"
        pitching:
          type: array
          items:
            $ref: "#/components/schemas/PitcherLineDto"
      required:
        - teamAbbr
        - linescore
        - batting
        - pitching
    BoxScoreDto:
      type: object
      properties:
        providerGameId:
          type: string
        away:
          $ref: "#/components/schemas/BoxScoreSideDto"
        home:
          $ref: "#/components/schemas/BoxScoreSideDto"
        ts:
          type: string
      required:
        - providerGameId
        - away
        - home
        - ts
