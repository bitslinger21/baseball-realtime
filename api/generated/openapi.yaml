openapi: 3.0.0
paths:
  /games/today:
    get:
      operationId: Games_today
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameDto"
        "500":
          description: ""
      summary: List games for today
      tags: &a1
        - games
  /games/id/{id}:
    get:
      operationId: Games_findByMyId
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDto"
        "404":
          description: ""
      summary: List games by internal ID
      tags: *a1
  /games/providerId/{providerGameId}:
    get:
      operationId: Games_findByProviderId
      parameters:
        - name: providerGameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameViewDto"
        "404":
          description: ""
      summary: List games by provider ID
      tags: *a1
  /games:
    get:
      operationId: Games_listByDate
      parameters:
        - name: date
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameViewDto"
        "500":
          description: ""
      summary: List games for specific date
      tags: *a1
  /games/{providerGameId}/alerts:
    get:
      operationId: Alerts_listAlertsForGame
      parameters:
        - name: providerGameId
          required: true
          in: path
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags:
        - Alerts
  /realtime/ping:
    get:
      operationId: Realtime_ping
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a2
        - Realtime
  /realtime/test:
    post:
      operationId: Realtime_sendTest
      parameters: []
      responses:
        "201":
          description: ""
      tags: *a2
  /poller/enable:
    get:
      operationId: Poller_enable
      parameters:
        - name: gameId
          required: true
          in: query
          schema:
            type: string
        - name: cadence
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: &a3
        - Poller
  /poller/disable:
    get:
      operationId: Poller_disable
      parameters:
        - name: gameId
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a3
  /poller/kick/{gameId}:
    post:
      operationId: Poller_kickOnce
      parameters:
        - name: gameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: ""
      tags: *a3
  /poller/{gameId}/meta:
    get:
      operationId: Poller_getGameMeta
      parameters:
        - name: gameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a3
  /boxscore/{providerGameId}:
    get:
      operationId: BoxScore_get
      parameters:
        - name: providerGameId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoxScoreDto"
      tags:
        - boxscore
  /players/{mlbId}:
    get:
      operationId: Players_getPlayer
      parameters:
        - name: mlbId
          required: true
          in: path
          schema:
            type: number
        - name: season
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: &a4
        - Players
  /players/{mlbId}/team:
    get:
      operationId: Players_getPlayerTeam
      parameters:
        - name: mlbId
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
      tags: *a4
  /players/{mlbId}/overview/batter:
    get:
      operationId: Players_getBatterOverview
      parameters:
        - name: mlbId
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatterOverviewDto"
      tags: *a4
  /players/{mlbId}/splits:
    get:
      operationId: Players_getPlayerSplits
      parameters:
        - name: mlbId
          required: true
          in: path
          schema:
            type: number
        - name: season
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSplitsDto"
      tags: *a4
  /players/{mlbId}/drilldown:
    get:
      operationId: Players_getPlayerDrilldown
      parameters:
        - name: mlbId
          required: true
          in: path
          schema:
            type: number
        - name: season
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDrilldownDto"
      tags: *a4
  /players/{mlbId}/pitching:
    get:
      operationId: Players_getPlayerPitching
      parameters:
        - name: mlbId
          required: true
          in: path
          schema:
            type: number
        - name: season
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerPitchingDto"
      tags: *a4
  /standings:
    get:
      operationId: Standings_getStandings
      parameters:
        - name: season
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StandingTeamDto"
      summary: Get MLB standings for a season
      tags:
        - standings
  /leaders:
    get:
      operationId: Leaders_getLeagueLeaders
      parameters:
        - name: season
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueLeadersDto"
      tags:
        - Leaders
  /health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        "200":
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example: &a5
                      database: &a6
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *a5
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example: *a5
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a7
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a6
                      redis: *a7
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags:
        - Health
info:
  title: Baseball Realtime API
  description: API for baseball-realtime
  version: 1.0.24
  contact: {}
tags: []
servers: []
components:
  schemas:
    LinescoreTeamDto:
      type: object
      properties:
        runs:
          type: object
          example: 3
          nullable: true
        hits:
          type: object
          example: 7
          nullable: true
        errors:
          type: object
          example: 0
          nullable: true
    LinescoreDto:
      type: object
      properties:
        away:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LinescoreTeamDto"
        home:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LinescoreTeamDto"
        currentInning:
          type: object
          example: 5
          nullable: true
        inningHalf:
          type: object
          example: Top
          nullable: true
        isTopInning:
          type: object
          example: true
          nullable: true
        outs:
          type: object
          example: 2
          nullable: true
    GameDto:
      type: object
      properties:
        id:
          type: string
          description: Internal unique game ID (UUID)
          example: 2f1e8d10-4b8a-4e59-a07a-61d9c6c4cf71
        providerGameId:
          type: string
          description: External provider-assigned game ID
          example: "663937"
        gameDate:
          type: string
          description: UTC calendar date of the game (YYYY-MM-DD)
          example: 2025-10-30
        homeAbbr:
          type: string
          description: Home team abbreviation (usually 2–5 chars)
          example: HOU
          maxLength: 5
        awayAbbr:
          type: string
          description: Away team abbreviation (usually 2–5 chars)
          example: DET
          maxLength: 5
        homeName:
          type: string
          description: Home team name
          example: Astros
        awayName:
          type: string
          description: Away team name
          example: Tigers
        status:
          type: string
          description: Current game status
          enum: &a8
            - scheduled
            - live
            - final
          example: final
        startTimeUtc:
          type: string
          description: Start time of the game in UTC (timestamp)
          format: date-time
          example: 2025-10-30T19:05:00Z
          nullable: true
        snapshot:
          type: object
          description: Arbitrary JSON snapshot of provider metadata (venue, IDs, etc.)
          example: &a9
            venue: Minute Maid Park
            providerVenueId: 2143
            feedUrl: https://api.sportsdata.io/v4/mlb/scores/json/Game/663937
          nullable: true
        homeScore:
          type: object
          description: Current home team score
          example: 5
          nullable: true
        awayScore:
          type: object
          description: Current away team score
          example: 3
          nullable: true
        detailedState:
          type: object
          description: Provider detailed state (e.g., Delayed, Postponed, Suspended).
            Useful for edge statuses.
          example: Delayed Start
          nullable: true
        inning:
          type: object
          description: Current inning number (live games only)
          example: 5
          nullable: true
        half:
          type: string
          description: Current half inning (live games only)
          enum: &a10
            - top
            - bottom
          example: top
          nullable: true
        outs:
          type: object
          description: Current outs (live games only)
          example: 2
          nullable: true
        linescore:
          description: Full linescore snapshot for the current game state
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LinescoreDto"
        currentInning:
          type: object
          description: Current inning number (alias used by some provider feeds)
          example: 5
          nullable: true
        isTopInning:
          type: object
          description: Whether it is currently the top half of the inning
          example: true
          nullable: true
        halfInning:
          type: object
          description: Half-inning label (e.g. "Top", "Bottom")
          example: Top
          nullable: true
      required:
        - gameDate
        - homeAbbr
        - awayAbbr
        - homeName
        - awayName
        - status
    GameViewDto:
      type: object
      properties:
        id:
          type: string
          description: Internal unique game ID (UUID)
          example: 2f1e8d10-4b8a-4e59-a07a-61d9c6c4cf71
        providerGameId:
          type: string
          description: External provider-assigned game ID
          example: "663937"
        gameDate:
          type: string
          description: UTC calendar date of the game (YYYY-MM-DD)
          example: 2025-10-30
        homeAbbr:
          type: string
          description: Home team abbreviation (usually 2–5 chars)
          example: HOU
          maxLength: 5
        awayAbbr:
          type: string
          description: Away team abbreviation (usually 2–5 chars)
          example: DET
          maxLength: 5
        homeName:
          type: string
          description: Home team name
          example: Astros
        awayName:
          type: string
          description: Away team name
          example: Tigers
        status:
          type: string
          description: Current game status
          enum: *a8
          example: final
        startTimeUtc:
          type: string
          description: Start time of the game in UTC (timestamp)
          format: date-time
          example: 2025-10-30T19:05:00Z
          nullable: true
        snapshot:
          type: object
          description: Arbitrary JSON snapshot of provider metadata (venue, IDs, etc.)
          example: *a9
          nullable: true
        homeScore:
          type: object
          description: Current home team score
          example: 5
          nullable: true
        awayScore:
          type: object
          description: Current away team score
          example: 3
          nullable: true
        detailedState:
          type: object
          description: Provider detailed state (e.g., Delayed, Postponed, Suspended).
            Useful for edge statuses.
          example: Delayed Start
          nullable: true
        inning:
          type: object
          description: Current inning number (live games only)
          example: 5
          nullable: true
        half:
          type: string
          description: Current half inning (live games only)
          enum: *a10
          example: top
          nullable: true
        outs:
          type: object
          description: Current outs (live games only)
          example: 2
          nullable: true
        linescore:
          description: Full linescore snapshot for the current game state
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LinescoreDto"
        currentInning:
          type: object
          description: Current inning number (alias used by some provider feeds)
          example: 5
          nullable: true
        isTopInning:
          type: object
          description: Whether it is currently the top half of the inning
          example: true
          nullable: true
        halfInning:
          type: object
          description: Half-inning label (e.g. "Top", "Bottom")
          example: Top
          nullable: true
        homeTeamMeta:
          type: object
          nullable: true
        awayTeamMeta:
          type: object
          nullable: true
      required:
        - gameDate
        - homeAbbr
        - awayAbbr
        - homeName
        - awayName
        - status
    TeamLineScoreDto:
      type: object
      properties:
        runs:
          type: number
        hits:
          type: number
        errors:
          type: number
        inningRuns:
          type: array
          items:
            type: number
            nullable: true
          nullable: true
          description: Runs per inning (index 0 = inning 1); null means inning not yet
            played
      required:
        - runs
        - hits
        - errors
    BatterLineDto:
      type: object
      properties:
        playerId:
          type: number
        name:
          type: string
        battingOrder:
          type: string
          nullable: true
        jerseyNumber:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        ab:
          type: number
        r:
          type: number
        h:
          type: number
        rbi:
          type: number
        bb:
          type: number
        so:
          type: number
        hr:
          type: number
      required:
        - playerId
        - name
        - ab
        - r
        - h
        - rbi
        - bb
        - so
        - hr
    BenchPlayerDto:
      type: object
      properties:
        playerId:
          type: number
        name:
          type: string
        jerseyNumber:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
      required:
        - playerId
        - name
    PitcherLineDto:
      type: object
      properties:
        playerId:
          type: number
        name:
          type: string
        jerseyNumber:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        ip:
          type: string
        h:
          type: number
        r:
          type: number
        er:
          type: number
        bb:
          type: number
        so:
          type: number
        pitches:
          type: object
          nullable: true
        strikes:
          type: object
          nullable: true
      required:
        - playerId
        - name
        - ip
        - h
        - r
        - er
        - bb
        - so
    BoxScoreSideDto:
      type: object
      properties:
        teamAbbr:
          type: string
        linescore:
          $ref: "#/components/schemas/TeamLineScoreDto"
        batting:
          type: array
          items:
            $ref: "#/components/schemas/BatterLineDto"
        bench:
          type: array
          items:
            $ref: "#/components/schemas/BenchPlayerDto"
        pitching:
          type: array
          items:
            $ref: "#/components/schemas/PitcherLineDto"
      required:
        - teamAbbr
        - linescore
        - batting
        - bench
        - pitching
    BoxScoreDto:
      type: object
      properties:
        providerGameId:
          type: string
        away:
          $ref: "#/components/schemas/BoxScoreSideDto"
        home:
          $ref: "#/components/schemas/BoxScoreSideDto"
        ts:
          type: string
      required:
        - providerGameId
        - away
        - home
        - ts
    BatterOverviewHeadlineDto:
      type: object
      properties:
        battingAverage:
          type: string
          description: The player's batting average for the season.
        onBasePercentage:
          type: string
          description: The player's on-base percentage for the season.
        sluggingPercentage:
          type: string
          description: The player's slugging percentage for the season.
        onBasePlusSlugging:
          type: string
          description: The player's OPS for the season.
        homeRuns:
          type: number
          description: The player's home runs for the season.
        runsBattedIn:
          type: number
          description: The player's runs batted in for the season.
      required:
        - battingAverage
        - onBasePercentage
        - sluggingPercentage
        - onBasePlusSlugging
        - homeRuns
        - runsBattedIn
    BatterOverviewSecondaryDto:
      type: object
      properties:
        games:
          type: number
          description: The number of games played.
        atBats:
          type: number
          description: The number of at-bats.
        runs:
          type: number
          description: The number of runs scored.
        hits:
          type: number
          description: The number of hits.
        doubles:
          type: number
          description: The number of doubles.
        triples:
          type: number
          description: The number of triples.
        walks:
          type: number
          description: The number of walks.
        strikeouts:
          type: number
          description: The number of strikeouts.
        stolenBases:
          type: number
          description: The number of stolen bases.
      required:
        - games
        - atBats
        - runs
        - hits
        - doubles
        - triples
        - walks
        - strikeouts
        - stolenBases
    BatterOverviewTodayDto:
      type: object
      properties:
        label:
          type: string
          description: The label for today's stats.
        statLine:
          type: string
          description: The stat line for today's stats.
        isLive:
          type: boolean
          description: Whether the player is currently in a live game.
        plateAppearances:
          type: object
          nullable: true
          example: 4
        atBats:
          type: object
          nullable: true
          example: 3
        hits:
          type: object
          nullable: true
          example: 1
        homeRuns:
          type: object
          nullable: true
          example: 1
        rbi:
          type: object
          nullable: true
          example: 2
        walks:
          type: object
          nullable: true
          example: 1
        strikeouts:
          type: object
          nullable: true
          example: 1
        avg:
          type: object
          nullable: true
          example: ".333"
        gameStatus:
          type: object
          nullable: true
          example: live
        opponent:
          type: object
          nullable: true
          example: NYY
        gameId:
          type: object
          nullable: true
          example: "748531"
      required:
        - label
        - statLine
        - isLive
    BatterOverviewDto:
      type: object
      properties:
        playerId:
          type: string
          description: The player's unique identifier.
        season:
          type: number
          description: The season for which the stats are displayed.
        headline:
          description: The player's headline stats for the season.
          allOf:
            - $ref: "#/components/schemas/BatterOverviewHeadlineDto"
        secondary:
          description: The player's secondary stats for the season.
          allOf:
            - $ref: "#/components/schemas/BatterOverviewSecondaryDto"
        today:
          description: The player's stats for today.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BatterOverviewTodayDto"
      required:
        - playerId
        - season
        - headline
        - secondary
        - today
    SplitRowDto:
      type: object
      properties:
        splitCode:
          type: string
          example: vl
        label:
          type: string
          example: vs LHP
        games:
          type: number
          example: 45
        atBats:
          type: number
          example: 130
        hits:
          type: number
          example: 38
        homeRuns:
          type: number
          example: 8
        rbi:
          type: number
          example: 22
        baseOnBalls:
          type: number
          example: 15
        strikeOuts:
          type: number
          example: 30
        avg:
          type: string
          example: ".292"
        obp:
          type: string
          example: ".365"
        slg:
          type: string
          example: ".480"
        ops:
          type: string
          example: ".845"
        group:
          type: string
          example: handedness
      required:
        - splitCode
        - label
        - games
        - atBats
        - hits
        - homeRuns
        - rbi
        - baseOnBalls
        - strikeOuts
        - avg
        - obp
        - slg
        - ops
    PlayerSplitsDto:
      type: object
      properties:
        playerId:
          type: string
          example: "592450"
        season:
          type: number
          example: 2025
        splits:
          type: array
          items:
            $ref: "#/components/schemas/SplitRowDto"
      required:
        - playerId
        - season
        - splits
    GameLogRowDto:
      type: object
      properties:
        date:
          type: string
          example: 2025-03-27
        opponent:
          type: string
          example: Milwaukee Brewers
        opponentId:
          type: number
          example: 158
        isHome:
          type: boolean
          example: true
        isWin:
          type: object
          nullable: true
          example: true
        summary:
          type: string
          example: 1-4 | HR, 2 RBI
        atBats:
