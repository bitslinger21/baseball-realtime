name: Scorebook CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  api:
    name: Build API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    env:
      AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run API tests
        run: yarn test --runInBand --watch=false

      - name: Build API
        run: yarn build

  client:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    env:
      AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Frontend
        env:
          VITE_API_URL: /api
          VITE_SOCKET_URL: /realtime
        run: yarn build

